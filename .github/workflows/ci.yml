name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is required by the Vitest browser-mode component tests.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The e2e harness boots a real `node build` server against an ephemeral
      # Postgres testcontainer (started by Playwright globalSetup) and runs the
      # reader navigation + axe-core a11y specs. GitHub-hosted runners ship a
      # working Docker daemon, which testcontainers uses out of the box.
      - run: pnpm build
      # Single-mode harness (no SMTP): the consultation-share + workspace specs.
      - run: pnpm test:e2e
      # Multi-mode harness (its own config): boots a SECOND, isolated stack - a
      # Postgres testcontainer PLUS a Mailpit testcontainer (the SMTP double) - in
      # multi-author mode, then runs the Epic 8 magic-link, tenancy-isolation, and
      # reader-verification flows end to end against the real SMTP capture. Separate
      # containers and app port, so it never collides with the single-mode run above.
      - run: pnpm test:e2e:multi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Reader-path JS budget gate (NFR3): exits non-zero if the view-route
      # closure busts 200 KB compressed.
      - run: pnpm reader:budget

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Build only, no push: proves the production image assembles from a
      # clean context (story 1.3 / AR8 / D15).
      - run: docker build --tag acta-diurna:ci .
      # Scan the freshly built image before it could ever be pushed (docker.md
      # tooling gate). Fails the job on any fixable HIGH/CRITICAL OS or library
      # CVE. ignore-unfixed skips findings with no upstream patch yet (nothing to
      # act on, and they would otherwise block every build until a base image
      # rebuild lands). A finding that must be waived despite a fix goes in
      # .trivyignore with a justifying comment, never a blanket severity drop.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acta-diurna:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
