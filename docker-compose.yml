services:
  app:
    build: .
    # Permanent boot failures (bad env, failed migration) must stop, not loop silently.
    restart: on-failure:5
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-acta_diurna}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTHOR_PASSWORD_HASH: ${AUTHOR_PASSWORD_HASH}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOADS_DIR: /data/uploads
      # adapter-node's transport body cap. Defaults to 512K, BELOW the 50 MB push
      # cap (MAX_UPLOAD_BYTES in src/lib/server/ingestion), so a legitimate
      # 512K-50MB push would be rejected at the transport with a generic error and
      # the app's actionable 413 would be unreachable. Keep this aligned with
      # MAX_UPLOAD_BYTES (a hair above) so the app-level cap is the one that fires.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-52428800}
      # Reader-realm session lifetime in days (story 3.3); absent -> 30-day default.
      READER_SESSION_TTL: ${READER_SESSION_TTL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  db:
    # postgres:17-alpine = PostgreSQL 17.10 at pin time
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acta_diurna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint runs as root then drops to postgres (gosu): the minimum it needs.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID

volumes:
  pgdata:
  uploads:
